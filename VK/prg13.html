<!DOCTYPE html>
<html>

<head>
    <title>Bulb on / off</title>
</head>

<body>

    <img id="bulb" src="black.jpg" width="500" height="500">
    <br><br>

    <button onclick="document.getElementById('bulb').src='bulb.jpg'">
        Turn on the light
    </button>

    <button onclick="document.getElementById('bulb').src='black.jpg'">
        Turn off the light
    </button>

</body>

</html>
