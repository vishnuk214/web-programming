

<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <script>
    function validateForm()
    {
        var fname = document.getElementById("fname").value;
        var lname = document.getElementById("lname").value;
        var email = document.getElementById("email").value;
        var mobile = document.getElementById("mobile").value;

        var namePattern = /^[a-zA-Z]+$/;
        var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        var mobilePattern = /^[0-9]{10}$/;

        if (!namePattern.test(fname) ||
            !namePattern.test(lname))
        {
            alert("Enter a valid name");
            return false;
        }

        if (!emailPattern.test(email))
        {
            alert("Enter a valid email");
            return false;
        }

        if (!mobilePattern.test(mobile))
        {
            alert("Enter a valid 10 digit mobile number");
            return false;
        }

        alert("Registration Successful!");
        return true;
    }
    </script>
</head>

<body>

<h2 align="center">Student Registration Form</h2>

<form onsubmit="return validateForm()">

<table align="center" cellpadding="8">

<tr>
<td>First Name</td>
<td><input type="text" id="fname" required></td>
</tr>

<tr>
<td>Last Name</td>
<td><input type="text" id="lname" required></td>
</tr>

<tr>
<td>Email</td>
<td><input type="text" id="email" required></td>
</tr>

<tr>
<td>Mobile Number</td>
<td><input type="text" id="mobile" maxlength="10" required></td>
</tr>

<tr>
<td>Password</td>
<td><input type="password" maxlength="30"></td>
</tr>

<tr>
<td>Date of Birth</td>
<td><input type="date"></td>
</tr>

<tr>
<td>Course Applied For</td>
<td>
<input type="radio" name="course"> MCA
<input type="radio" name="course"> M.Tech
<input type="radio" name="course"> MSc
<input type="radio" name="course"> Ph.D
</td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td>Address</td>
<td><textarea rows="2" cols="25"></textarea></td>
</tr>

<tr>
<td>City</td>
<td><input type="text" maxlength="30"></td>
</tr>

<tr>
<td>Pincode</td>
<td><input type="number"></td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="SUBMIT">
<input type="reset" value="RESET">
</td>
</tr>

</table>
</form>

</body>
</html>
